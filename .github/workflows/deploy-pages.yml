name: Deploy Pages (CI-gated)

# Only the passing main-push CI workflow may call this promotion workflow.
on:
  workflow_call:
    inputs:
      candidate_artifact_id:
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Pages artifact
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      environment_id: ${{ steps.policy.outputs.environment_id }}
      pages_artifact_id: ${{ steps.pages.outputs.artifact_id }}
      pages_artifact_name: ${{ steps.package.outputs.name }}
      tar_sha256: ${{ steps.package.outputs.tar_sha256 }}
      wasm_sha256: ${{ steps.package.outputs.wasm_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Require a protected production environment
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-pages-policy.mjs prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          merge-multiple: true
          path: release-bundle
      - name: Verify exact candidate and complete file inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat release-bundle/SOURCE_COMMIT)" = "$GITHUB_SHA"
          cd release-bundle
          test -f public/.nojekyll
          test -z "$(find public ! -type f ! -type d -print -quit)"
          test -z "$(find public -type f -links +1 -print -quit)"
          test -z "$(find public \( -name .git -o -name .github \) -print -quit)"
          # Compare the full inventory before trusting manifest paths.
          find public -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > actual.sha256
          cmp SHA256SUMS actual.sha256
          sha256sum -c --strict SHA256SUMS
      - name: Create Pages artifact before human approval
        id: pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/public
          include-hidden-files: true
          retention-days: 7
      - name: Bind packaged bytes to this workflow run
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Check the actual tar produced by the pinned Pages action.
          mkdir -p "$RUNNER_TEMP/pages-verify/public"
          tar -xf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/pages-verify/public" --no-same-owner --no-same-permissions
          (cd "$RUNNER_TEMP/pages-verify"; find public -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/pages-actual.sha256"
          cmp release-bundle/SHA256SUMS "$RUNNER_TEMP/pages-actual.sha256"
          printf 'name=github-pages-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'tar_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'wasm_sha256=%s\n' "$(sha256sum release-bundle/public/vendor/sevenzip-wasm/sevenzip-wasm.wasm | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf '### Pages candidate\n\nCommit: `%s`\n\nCI run: `%s`\n\nReview the CI evidence and outstanding browser exception before approving.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Pages (human approval)
    needs: prepare
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify approval, artifact availability and current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT_ID: ${{ needs.prepare.outputs.environment_id }}
          PAGES_ARTIFACT_ID: ${{ needs.prepare.outputs.pages_artifact_id }}
          PAGES_ARTIFACT_NAME: ${{ needs.prepare.outputs.pages_artifact_name }}
        run: node scripts/check-pages-policy.mjs deploy
      - name: Retrieve the same immutable Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.pages_artifact_id }}
          merge-multiple: true
          path: pages-candidate
      - name: Verify packaged bytes before promotion
        shell: bash
        env:
          EXPECTED_TAR_SHA256: ${{ needs.prepare.outputs.tar_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAR_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  pages-candidate/artifact.tar\n' "$EXPECTED_TAR_SHA256" | sha256sum -c --strict -
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: ${{ needs.prepare.outputs.pages_artifact_name }}
      - name: Check deployed application
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_WASM_SHA256: ${{ needs.prepare.outputs.wasm_sha256 }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --max-time 30 --output "$RUNNER_TEMP/page.html" "${PAGE_URL%/}/"
          grep -F 'SecurBrowser Toolkit' "$RUNNER_TEMP/page.html" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --max-time 30 --output "$RUNNER_TEMP/sevenzip.wasm" "${PAGE_URL%/}/vendor/sevenzip-wasm/sevenzip-wasm.wasm"
          [[ "$EXPECTED_WASM_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_WASM_SHA256" "$RUNNER_TEMP/sevenzip.wasm" | sha256sum -c --strict -
