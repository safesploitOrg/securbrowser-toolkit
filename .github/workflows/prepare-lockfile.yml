name: Prepare npm lockfile

# Bootstrap only. Does not write to the repository, deploy, or approve a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Generate and verify real npm lockfile
        run: bash scripts/prepare-lockfile.sh
      - name: Record source revision and lockfile digest
        run: |
          mkdir lockfile-artifact
          cp package-lock.json lockfile-artifact/
          git rev-parse HEAD > lockfile-artifact/SOURCE_COMMIT
          sha256sum package.json package-lock.json > lockfile-artifact/SHA256SUMS
          node --version > lockfile-artifact/TOOLCHAIN
          npm --version >> lockfile-artifact/TOOLCHAIN
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-lockfile-candidate
          path: lockfile-artifact/
          if-no-files-found: error
          retention-days: 7
