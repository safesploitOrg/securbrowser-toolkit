name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after every required gate passes (main only)
        type: boolean
        default: false
      approval_reference:
        description: Recorded human owner review of the exact revision (required for deploy)
        type: string
        required: false
      approval_commit:
        description: Full SHA of the human-reviewed revision (required for deploy)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify Node.js runtime
        run: |
          node --version
          test "$(node --version)" = "v$(cat .node-version)"
      - name: Validate committed lockfile
        run: npm run lockfile:check
      - name: Install development dependencies
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify repository layout and dependency boundary
        if: ${{ always() }}
        run: npm run layout:check && npm run deps:production
      - name: Run dependency-free HTML checks
        if: ${{ always() }}
        run: npm run validate:html:static
      - name: Validate HTML against html-validate
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npx --no-install html-validate public/index.html
      - name: Run unit tests
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-reports
          npm run test:unit | tee verification-reports/unit-tests.txt
      - name: Lint JavaScript
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Check repository style
        if: ${{ always() }}
        run: npm run style:check
      - name: Validate Bash harnesses
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Retain unit-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-evidence
          path: verification-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Build pinned WASM runtime once
        run: npm run build:public
      - name: Package candidate and integrity manifest
        run: |
          mkdir -p release-bundle
          cp -a public release-bundle/public
          cp .cache/sevenzip-wasm.zip release-bundle/vendor-source.zip
          (cd release-bundle && find public -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-public
          path: release-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Dependency security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm run lockfile:check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce dependency audit
        run: |
          mkdir -p verification-reports
          npm audit --audit-level=high --json > verification-reports/npm-audit.json
      - name: Retain dependency audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-evidence
          path: verification-reports/
          if-no-files-found: warn
          retention-days: 14

  secrets:
    name: Secret detection gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and run pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          curl --fail --silent --show-error --location --max-time 120 --output "$work/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          mkdir -p verification-reports
          status=0
          "$work/gitleaks" git --redact=100 --exit-code 1 --no-banner . || status=$?
          printf "Gitleaks exit status: %s\n" "$status" > verification-reports/gitleaks-status.txt
          exit "$status"
      - name: Retain secret-scan status (no matched secret data)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-evidence
          path: verification-reports/
          if-no-files-found: warn
          retention-days: 14

  sast:
    name: CodeQL security gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          upload: never
          output: codeql-results
      - name: Enforce CodeQL results
        run: node scripts/check-sarif.mjs codeql-results
      - name: Retain SAST evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast-evidence
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 14

