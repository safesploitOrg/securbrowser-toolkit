  interoperability:
    name: Native 7-Zip interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm run lockfile:check
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-public
          path: release-bundle
      - name: Verify and use the exact candidate
        run: |
          (cd release-bundle && sha256sum -c SHA256SUMS)
          mv public public-source
          mv release-bundle/public public
          mkdir -p .cache
          mv release-bundle/vendor-source.zip .cache/sevenzip-wasm.zip
      - name: Ensure native 7-Zip is available
        run: |
          if ! command -v 7zz >/dev/null && ! command -v 7z >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y 7zip
          fi
      - run: npx playwright install --with-deps chromium
      - name: Native and WASM interoperability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-reports
          bash scripts/test-7z-interop.sh | tee verification-reports/7zip-interop.txt
      - name: Retain interoperability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wasm-interop-evidence
          path: verification-reports/
          if-no-files-found: warn
          retention-days: 14

  release-review:
    name: Validate release review reference
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require approval bound to the exact commit
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          APPROVAL_COMMIT: ${{ inputs.approval_commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$APPROVAL_REFERENCE"
          test "$APPROVAL_COMMIT" = "$GITHUB_SHA"
          echo 'Review reference supplied for the selected revision. Environment/owner review is still required.'

  deploy:
    name: Release approved candidate
    needs: [
      quality, 
      dependency-audit, 
      secrets, 
      sast, 
      # browser, 
      interoperability, 
      release-review]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && inputs.approval_reference != '' && inputs.approval_commit == github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      approval_reference: ${{ inputs.approval_reference }}
      approval_commit: ${{ inputs.approval_commit }}
