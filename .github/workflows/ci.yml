name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify repository layout
        run: npm run layout:check

      - name: Verify zero npm production dependencies
        run: npm run deps:production

      - name: Prepare pinned 7-Zip WASM runtime
        run: npm run build:public

      - name: Check repository style
        run: npm run style:check

      # Needs to be re-enabled once the linter and HTML validator are fixed.
      # - name: Lint JavaScript
      #   run: npm run lint

      # - name: Validate HTML
      #   run: npm run validate:html

      # - name: Run unit tests
      #   run: npm run test:unit

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Prepare pinned 7-Zip WASM runtime
        run: npm run build:public

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium, Firefox and WebKit tests
        run: npm run test:e2e
